<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0010"/>
      <stop offset="100%" stop-color="#0d0008"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurPink"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg3)"/>
  <circle cx="200" cy="180" r="150" fill="url(#glow3)" filter="url(#blurPink)"/>

  <!-- Wave paths -->
  <path d="M0,280 Q50,240 100,270 Q150,300 200,255 Q250,210 300,245 Q350,280 400,250 L400,340 L0,340 Z"
        fill="#ec4899" fill-opacity="0.08" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M0,260 Q60,220 120,255 Q180,290 240,240 Q300,190 360,230 Q380,240 400,225 L400,340 L0,340 Z"
        fill="#f9a8d4" fill-opacity="0.05" stroke="#f472b6" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M0,300 Q40,265 90,285 Q160,315 220,270 Q280,225 340,265 Q370,280 400,260 L400,340 L0,340 Z"
        fill="#be185d" fill-opacity="0.07" stroke="#db2777" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Center shape - diamond -->
  <polygon points="200,100 255,185 200,270 145,185" fill="#ec4899" fill-opacity="0.15" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7" filter="url(#blurSoft)"/>
  <polygon points="200,120 242,188 200,256 158,188" fill="#ec4899" fill-opacity="0.2" stroke="#f9a8d4" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Inner glow -->
  <polygon points="200,150 224,188 200,226 176,188" fill="#fce7f3" fill-opacity="0.25"/>

  <!-- Sparkle dots -->
  <circle cx="320" cy="100" r="2" fill="#f9a8d4" fill-opacity="0.8"/>
  <circle cx="80" cy="130" r="1.5" fill="#f9a8d4" fill-opacity="0.6"/>
  <circle cx="350" cy="160" r="1" fill="#f9a8d4" fill-opacity="0.5"/>
  <circle cx="60" cy="250" r="1.5" fill="#f9a8d4" fill-opacity="0.4"/>

  <!-- Label bar -->
  <rect x="0" y="340" width="400" height="60" fill="black" fill-opacity="0.6"/>
  <rect x="0" y="340" width="400" height="1" fill="#ec4899" fill-opacity="0.6"/>

  <text x="20" y="368" font-family="'Courier New',monospace" font-size="11" fill="#f9a8d4" font-weight="bold">#3 / 5</text>
  <text x="20" y="386" font-family="Arial,sans-serif" font-size="13" fill="white" font-weight="bold">Pure Vibes</text>
  <text x="370" y="375" font-family="Arial,sans-serif" font-size="10" fill="#ec4899" font-weight="bold" text-anchor="end">YNC</text>
  <text x="370" y="388" font-family="Arial,sans-serif" font-size="9" fill="#be185d" text-anchor="end">UNCOMMON</text>
</svg>
