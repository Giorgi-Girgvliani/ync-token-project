<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="100%" stop-color="#06000f"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1)"/>

  <!-- Glow halo -->
  <circle cx="200" cy="200" r="140" fill="url(#glow1)" filter="url(#blur1)"/>

  <!-- Orbit rings -->
  <ellipse cx="200" cy="200" rx="155" ry="50" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.25" transform="rotate(-20 200 200)"/>
  <ellipse cx="200" cy="200" rx="130" ry="42" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2" transform="rotate(30 200 200)"/>
  <ellipse cx="200" cy="200" rx="170" ry="55" fill="none" stroke="#6d28d9" stroke-width="0.5" stroke-opacity="0.15" transform="rotate(60 200 200)"/>

  <!-- Main orb -->
  <circle cx="200" cy="200" r="72" fill="url(#orb1)" filter="url(#blur2)"/>
  <circle cx="200" cy="200" r="65" fill="url(#orb1)"/>
  <circle cx="178" cy="182" r="14" fill="white" fill-opacity="0.18"/>

  <!-- Stars -->
  <circle cx="60" cy="50" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="340" cy="80" r="1" fill="white" fill-opacity="0.5"/>
  <circle cx="310" cy="340" r="1.8" fill="white" fill-opacity="0.6"/>
  <circle cx="80" cy="320" r="1.2" fill="white" fill-opacity="0.4"/>
  <circle cx="350" cy="200" r="1" fill="white" fill-opacity="0.5"/>
  <circle cx="20" cy="200" r="1.5" fill="white" fill-opacity="0.6"/>
  <circle cx="130" cy="40" r="1" fill="white" fill-opacity="0.3"/>
  <circle cx="270" cy="360" r="1.2" fill="white" fill-opacity="0.4"/>

  <!-- Label bar -->
  <rect x="0" y="340" width="400" height="60" fill="black" fill-opacity="0.55"/>
  <rect x="0" y="340" width="400" height="1" fill="#7c3aed" fill-opacity="0.6"/>

  <!-- Text -->
  <text x="20" y="368" font-family="'Courier New',monospace" font-size="11" fill="#a78bfa" font-weight="bold">#1 / 5</text>
  <text x="20" y="386" font-family="Arial,sans-serif" font-size="13" fill="white" font-weight="bold">The Void</text>
  <text x="370" y="375" font-family="Arial,sans-serif" font-size="10" fill="#7c3aed" font-weight="bold" text-anchor="end">YNC</text>
  <text x="370" y="388" font-family="Arial,sans-serif" font-size="9" fill="#6d28d9" text-anchor="end">COMMON</text>
</svg>
