<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c1b"/>
      <stop offset="100%" stop-color="#000d1f"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurCyan"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg2)"/>
  <circle cx="200" cy="195" r="130" fill="url(#glow2)" filter="url(#blurCyan)"/>

  <!-- Hexagonal grid -->
  <!-- Row 1 -->
  <polygon points="200,80 222,92 222,116 200,128 178,116 178,92" fill="none" stroke="#0e7490" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Row 2 -->
  <polygon points="156,128 178,140 178,164 156,176 134,164 134,140" fill="none" stroke="#0891b2" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="244,128 266,140 266,164 244,176 222,164 222,140" fill="none" stroke="#0891b2" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Row 3 - center -->
  <polygon points="200,164 222,176 222,200 200,212 178,200 178,176" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Row 3 sides -->
  <polygon points="112,164 134,176 134,200 112,212 90,200 90,176" fill="none" stroke="#0e7490" stroke-width="1" stroke-opacity="0.3"/>
  <polygon points="288,164 310,176 310,200 288,212 266,200 266,176" fill="none" stroke="#0e7490" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Row 4 -->
  <polygon points="156,200 178,212 178,236 156,248 134,236 134,212" fill="none" stroke="#0891b2" stroke-width="1" stroke-opacity="0.4"/>
  <polygon points="244,200 266,212 266,236 244,248 222,236 222,212" fill="none" stroke="#0891b2" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Row 5 -->
  <polygon points="200,236 222,248 222,272 200,284 178,272 178,248" fill="none" stroke="#0e7490" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Center glow dot -->
  <circle cx="200" cy="188" r="18" fill="#67e8f9" fill-opacity="0.9"/>
  <circle cx="200" cy="188" r="10" fill="white" fill-opacity="0.8"/>
  <circle cx="195" cy="183" r="4" fill="white"/>

  <!-- Corner sparkles -->
  <line x1="40" y1="40" x2="50" y2="40" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="45" y1="35" x2="45" y2="45" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="350" y1="40" x2="360" y2="40" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="355" y1="35" x2="355" y2="45" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Label bar -->
  <rect x="0" y="340" width="400" height="60" fill="black" fill-opacity="0.6"/>
  <rect x="0" y="340" width="400" height="1" fill="#06b6d4" fill-opacity="0.6"/>

  <text x="20" y="368" font-family="'Courier New',monospace" font-size="11" fill="#67e8f9" font-weight="bold">#2 / 5</text>
  <text x="20" y="386" font-family="Arial,sans-serif" font-size="13" fill="white" font-weight="bold">The Silence</text>
  <text x="370" y="375" font-family="Arial,sans-serif" font-size="10" fill="#06b6d4" font-weight="bold" text-anchor="end">YNC</text>
  <text x="370" y="388" font-family="Arial,sans-serif" font-size="9" fill="#0891b2" text-anchor="end">COMMON</text>
</svg>
